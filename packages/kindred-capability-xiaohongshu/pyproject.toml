[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindred-capability-xiaohongshu"
version = "0.3.3"
description = "Portable Xiaohongshu capability backed by hi_x_h_5"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27,<1",
  "kindred-capability-sdk>=0.1.0,<0.2",
]

[project.entry-points."kindred.capability.v1"]
xiaohongshu = "kindred_capability_xiaohongshu.plugin:create_capability"

[project.entry-points."kindred.resources.v1"]
xiaohongshu = "kindred_capability_xiaohongshu.resources:resource_root"

[tool.hatch.build.targets.wheel]
packages = ["src/kindred_capability_xiaohongshu"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/kindred_capability_xiaohongshu"]
