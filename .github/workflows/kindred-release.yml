name: Kindred XHS release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['kindred-xhs-v*']

permissions:
  contents: read

jobs:
  source-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan source history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --exit-code 1'

  wheel:
    needs: source-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build packages/kindred-capability-xiaohongshu
      - run: |
          cd packages/kindred-capability-xiaohongshu/dist
          sha256sum *.whl > SHA256SUMS
          test "$(awk '{print $2}' SHA256SUMS)" = "$(basename ./*.whl)"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kindred-capability-xiaohongshu-wheel
          path: |
            packages/kindred-capability-xiaohongshu/dist/*.whl
            packages/kindred-capability-xiaohongshu/dist/SHA256SUMS

  sidecar:
    needs: source-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: ubuntu-24.04
            target: ubuntu-24.04-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 canvas sharp
      - run: npm test
        env:
          GEMINI_API_KEY: test-key-explore-ai
      - run: npm run build
      - run: python3 scripts/build-kindred-sidecar.py --target ${{ matrix.target }}
      - name: Verify release metadata boundary
        run: |
          test -z "$(find release -path '*/node_modules/canvas/build/*' -type f \
            \( -name Makefile -o -name binding.Makefile -o -name canvas.target.mk \
               -o -name config.gypi -o -name gyp-mac-tool \) -print)"
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then archive="darwin_arm64"; else archive="linux_x64"; fi
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${archive}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan release tree
        run: |
          "$RUNNER_TEMP/gitleaks" detect --no-git --source release --redact --exit-code 1
      - uses: actions/upload-artifact@v4
        with:
          name: kindred-xhs-sidecar-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.sha256

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheel, sidecar]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
